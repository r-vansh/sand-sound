<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sand Sound</title>
<meta name="description" content="A sand floor that listens: sound shakes the grains into Chladni patterns.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<style>
:root {
  --panel-bg: #ffffff; --panel-fg: #171717; --panel-muted: #737373; --panel-line: #e5e5e5;
  --pill-line: #ededee; --pill-bg: #fcfcfd; --pill-hover: #f7f7f8;
  --g200: #dddddf; --g300: #c3c3c6; --g500: #8e8e95; --gmain: #101011; --focus: #101011;
  --cur: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724%27 height=%2724%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M5 3.5 19 11l-6.3 1.7L10.2 19z%27 fill=%27black%27 stroke=%27white%27 stroke-width=%271.5%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") 5 4, default;
  --cur-text: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724%27 height=%2724%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M12 5v14M9.5 4.5h5M9.5 19.5h5%27 stroke=%27white%27 stroke-width=%274%27/%3E%3Cpath d=%27M12 5v14M9.5 4.5h5M9.5 19.5h5%27 stroke=%27black%27 stroke-width=%271.5%27/%3E%3C/svg%3E") 12 12, text;
  --scrub-cursor: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724%27 height=%2724%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M2.5 12 9 7v10zM21.5 12 15 7v10z%27 fill=%27black%27 stroke=%27white%27 stroke-width=%271.5%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") 12 12, ew-resize;
}
html, body { margin: 0; height: 100%; overflow: hidden; cursor: var(--cur); background: #cdb9a2; font-family: "Geist", system-ui, sans-serif; }
canvas { position: fixed; left: 0; top: 0; display: block; width: 100%; height: 100%; cursor: none; touch-action: none; }

/* ---------- sand cursor: a fingertip seen from above. Its pad sits on the pointer; the finger trails
   behind the direction of travel and leans further back the faster it moves (script: updateCur). ---------- */
#cur { position: fixed; left: 0; top: 0; z-index: 4; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .15s; }
#cur.on { opacity: 1; }
#cur i {
  position: absolute; left: calc(var(--r) * -1); top: calc(var(--r) * -1); box-sizing: border-box;
  width: calc(var(--r) * 2 + var(--len)); height: calc(var(--r) * 2); border-radius: var(--r);
  transform-origin: var(--r) var(--r); transform: rotate(var(--a));
  border: 1.5px solid rgba(16,16,17,.8);
  background: linear-gradient(90deg, rgba(16,16,17,.30), rgba(16,16,17,.16));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
  -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent); mask-image: linear-gradient(90deg, #000 45%, transparent);
  transition: background .12s;
}
#cur i::before {                                   /* the nail */
  content: ""; position: absolute; left: calc(var(--r) * .22); top: 50%; box-sizing: border-box;
  width: calc(var(--r) * 1.05); height: calc(var(--r) * 1.2); margin-top: calc(var(--r) * -.6);
  border-radius: 46% 34% 34% 46% / 50%; background: rgba(255,255,255,.34); border: 1px solid rgba(255,255,255,.7);
}
#cur.down i { background: linear-gradient(90deg, rgba(16,16,17,.46), rgba(16,16,17,.24)); }

/* ---------- hint ---------- */
#hint {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 5; pointer-events: none;
  padding: 8px 12px; border-radius: 10px; background: rgba(16,16,17,.78); color: #f7f7f8;
  font: 400 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: -.03em; white-space: nowrap;
  transition: opacity .4s;
}
#hint.gone { opacity: 0; }
body.dropping canvas { outline: 2px dashed rgba(255,255,255,.5); outline-offset: -12px; }

/* ---------- tooltip: a dark pill with the label and one keycap per key (script: Tooltip) ---------- */
#tip {
  position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
  display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px; border-radius: 6px;
  background: #101011; color: #f7f7f8;
  font: 400 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: -.03em; white-space: nowrap;
  opacity: 0; transform: translateY(-2px); transition: opacity .08s, transform .08s;
}
#tip.show { opacity: 1; transform: none; }
#tip .keys { display: flex; align-items: center; gap: 4px; }
#tip kbd {
  box-sizing: border-box; min-width: 16px; height: 16px; padding: 0 3px; margin: 0; border-radius: 2px;
  display: grid; place-items: center; background: #a8a8ad; color: #101011;
  font: 400 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: -.03em;
}

/* ---------- panel ---------- */
#panel {
  position: fixed; top: 16px; right: 16px; z-index: 10; width: 300px; max-height: calc(100vh - 32px);
  display: flex; flex-direction: column; background: var(--panel-bg); color: var(--panel-fg);
  border: 1px solid var(--panel-line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.10);
  font-size: 13px; line-height: 1.4;
  transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s, visibility 0s;
}
#panel.collapsed { transform: translateX(calc(100% + 24px)); opacity: 0; visibility: hidden; pointer-events: none; transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s, visibility 0s .28s; }
#panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; user-select: none; border-bottom: 1px solid var(--panel-line); }
#panel header strong { font-weight: 600; font-size: 13px; letter-spacing: -.01em; }
.hbtn { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #101011; cursor: var(--cur); transition: background .12s; }
.hbtn svg { width: 15px; height: 15px; display: block; }
.hactions { display: flex; align-items: center; gap: 2px; }
.hbtn:hover:not([aria-disabled="true"]) { background: #f0f0f1; }
.hbtn:active:not([aria-disabled="true"]) { background: #e6e6e8; }
.hbtn[aria-disabled="true"] { opacity: .28; cursor: default; }   /* not [disabled]: a disabled button would swallow the hover that shows its tooltip */
.hbtn:focus-visible, #showTab:focus-visible { outline: 2px solid #101011; outline-offset: 1px; }
#showTab {
  position: fixed; top: 16px; right: 16px; z-index: 11; width: 104px; height: 32px; padding: 0 8px; box-sizing: border-box;
  display: flex; flex-direction: row-reverse; align-items: center; gap: 6px;
  border: 1px solid var(--panel-line); border-radius: 10px; background: var(--panel-bg); color: var(--panel-fg); cursor: var(--cur);
  box-shadow: 0 8px 30px rgba(0,0,0,.10); font: 500 12px/1 "Geist", system-ui, sans-serif; letter-spacing: -.01em; white-space: nowrap;
  transform: translateX(8px) scale(.9); opacity: 0; pointer-events: none;
  transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s, background .12s;
}
#showTab svg { width: 15px; height: 15px; display: block; flex: none; }
#showTab:hover { background: #f0f0f1; }
#panel.collapsed ~ #showTab { transform: none; opacity: 1; pointer-events: auto; transition-delay: .1s; }

#panel .body { overflow-y: auto; overflow-x: hidden; padding: 4px 14px 14px; scrollbar-width: thin; scrollbar-color: #c3c3c6 transparent; }
.cat { margin-top: 2px; }
.cat-head {
  display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 12px 0 14px; border: 0; background: none;
  color: var(--panel-fg); cursor: var(--cur); text-align: left; font: 500 16px/1.2 "Geist", system-ui, sans-serif; letter-spacing: -.01em;
}
.cat-head svg { width: 12px; height: 12px; color: #8e8e95; transition: transform .18s ease; }
.cat-head:hover svg { color: var(--panel-fg); }
.cat-head:focus-visible { outline: 2px solid #101011; outline-offset: 2px; border-radius: 4px; }
.cat.closed .cat-head svg { transform: rotate(-90deg); }
.cat-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease; }
.cat.closed .cat-body { grid-template-rows: 0fr; }
.cat-body > .grid { min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1fr; gap: 8px; padding-bottom: 2px; }
.cat.closed .cat-body > .grid { visibility: hidden; transition: visibility 0s linear .2s; }
.grid > [hidden] { display: none; }
.note { margin: 0 0 2px; color: #8e8e95; font-size: 12px; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* reset chip */
.reset { display: inline-grid; place-items: center; flex: none; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 4px; background: #ededee; cursor: var(--cur); visibility: hidden; transition: background .12s; }
.reset svg { display: block; width: 10px; height: 10px; }
.reset:hover { background: #dddddf; }

/* segmented source switch */
.seg { display: flex; gap: 6px; }
.seg button {
  flex: 1; height: 32px; padding: 0; border: 1px solid #ededee; border-radius: 10px; background: #fcfcfd; color: #5c5c61;
  font: 400 14px/1 "Geist", system-ui, sans-serif; letter-spacing: -.03em; cursor: var(--cur); box-shadow: inset 0 -2px 1px rgba(0,0,0,.05);
  transition: background .12s, color .12s;
}
.seg button:hover { background: #f7f7f8; }
.seg button.on { background: linear-gradient(to bottom, #d8d8da, #cdcdd0); color: #2a2a2d; border-color: #cdcdd0; }
.seg button:focus-visible { outline: 2px solid #101011; outline-offset: 2px; }

/* scrub pill */
.num {
  position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; height: 40px; padding: 0 12px; box-sizing: border-box;
  border-radius: 12px; background: var(--pill-bg); border: 1px solid var(--pill-line);
  font-size: 14px; line-height: 1; letter-spacing: -.03em; color: var(--gmain);
  cursor: var(--scrub-cursor); user-select: none; -webkit-user-select: none; touch-action: pan-y; transition: background .12s, border-color .12s;
}
.num::after { content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; pointer-events: none; box-shadow: inset 0 -2px 1px rgba(0,0,0,.05); }
.num:hover, .num.dragging { background: var(--pill-hover); }
.num.editing { background: var(--pill-bg); border-color: var(--focus); cursor: var(--cur-text); }
.num > :not(.track):not(.reset) { position: relative; z-index: 1; }
.num .track { position: absolute; inset: 0; border-radius: 11px; overflow: hidden; pointer-events: none; }
.num .dots { position: absolute; left: 11px; right: 11px; top: 18px; height: 2px; display: flex; justify-content: space-between; opacity: 0; transition: opacity .12s; }
.num .dots i { width: 2px; height: 2px; border-radius: 50%; background: var(--g200); }
.num .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0px); background: var(--g200); border-radius: 11px 0 0 11px; opacity: 0; transition: opacity .12s; }
.num .fill .dots { right: auto; left: 11px; width: calc(var(--pw, 100px) + 2px); opacity: 1; }
.num .fill .dots i { background: var(--g300); }
.num .handle { position: absolute; top: 50%; left: var(--p, 0px); width: 4px; height: 30px; margin: -15px 0 0 -2px; box-sizing: border-box; background: var(--g200); border: .25px solid transparent; border-radius: 12px; opacity: 0; transition: opacity .12s, background .12s; }
.num:hover .dots, .num.dragging .dots, .num:hover .handle, .num.dragging .handle { opacity: 1; }
.num.dragging .handle { background: var(--pill-hover); border-color: var(--g500); box-shadow: 0 0 1px rgba(0,0,0,.3); }
.num.dragging .fill { opacity: 1; }
.num.editing .dots, .num.editing .handle, .num.editing .fill { opacity: 0; }
.num .lbl { flex: 0 1 auto; min-width: 0; color: var(--g500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .12s; }
.num.dragging .lbl { opacity: 0; }
.num .val { display: inline-grid; flex: none; font-variant-numeric: tabular-nums; }
.num .val::after { content: attr(data-v); padding-right: 1px; visibility: hidden; white-space: pre; grid-area: 1 / 1; font: inherit; }
.num input { grid-area: 1 / 1; width: 0; min-width: 100%; border: 0; outline: 0; background: transparent; padding: 0; margin: 0; font: inherit; letter-spacing: inherit; font-variant-numeric: tabular-nums; color: inherit; cursor: inherit; caret-color: var(--focus); }
.num.editing input { cursor: var(--cur-text); }
.num input::selection { background: rgba(16,16,17,.14); }
.num .unit { flex: none; margin-left: -8px; }
.num .reset, .col .reset { position: absolute; z-index: 3; right: 8px; top: 50%; margin-top: -8px; }
html.scrubbing, html.scrubbing * { cursor: var(--scrub-cursor) !important; user-select: none !important; }

/* colour pill */
.col {
  position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; box-sizing: border-box;
  border-radius: 12px; background: var(--pill-bg); border: 1px solid var(--pill-line); box-shadow: inset 0 -2px 1px rgba(0,0,0,.05);
  font-size: 14px; letter-spacing: -.03em; color: var(--g500);
}
.col input { width: 44px; height: 24px; padding: 0; border: 1px solid var(--pill-line); border-radius: 6px; background: none; cursor: var(--cur); }
.col input::-webkit-color-swatch-wrapper { padding: 0; }
.col input::-webkit-color-swatch { border: 0; border-radius: 5px; }
.col input::-moz-color-swatch { border: 0; border-radius: 5px; }
.col code { font: 400 12px/1 "Geist Mono", ui-monospace, monospace; color: var(--gmain); }

/* buttons */
.buttons { display: flex; gap: 8px; }
.buttons.end { margin-top: 16px; }
.buttons button {
  position: relative; flex: 1; height: 40px; padding: 0 12px; box-sizing: border-box; font: 400 14px/1 "Geist", system-ui, sans-serif;
  letter-spacing: -.03em; text-align: center; white-space: nowrap; border-radius: 12px; cursor: var(--cur); transition: filter .12s, transform .06s, background .12s;
}
.buttons button:active { transform: scale(.98); }
.buttons button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.buttons button.primary { border: 0; color: #f7f7f8; background: radial-gradient(120% 160% at 36% -24%, #57575c, #101011 70%); box-shadow: inset 0 -2px 4px rgba(255,255,255,.3); }
.buttons button.primary:hover { filter: brightness(1.18); }
.buttons button.secondary { border: 1px solid #ededee; background: #fcfcfd; color: #101011; box-shadow: inset 0 -2px 1px rgba(0,0,0,.05); }
.buttons button.secondary:hover { background: #f7f7f8; }

@media (max-width: 520px) {
  #panel { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 50vh; }
  #panel.collapsed { transform: translateY(calc(100% + 16px)); }
  #showTab { top: auto; bottom: 8px; right: 8px; }
  #hint { bottom: auto; top: 20px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cur"><i></i></div>
<div id="hint">Drop an audio file, or press Space</div>
<aside id="panel">
  <header>
    <strong>Sand Sound</strong>
    <span class="hactions">
      <button id="undoBtn" class="hbtn" type="button" data-tip="Undo" data-key="Ctrl+Z" aria-label="Undo" aria-disabled="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.5 6.5H9a3.5 3.5 0 0 1 0 7H6"/></svg>
      </button>
      <button id="redoBtn" class="hbtn" type="button" data-tip="Redo" data-key="Ctrl+Shift+Z" aria-label="Redo" aria-disabled="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5H7a3.5 3.5 0 0 0 0 7h3"/></svg>
      </button>
      <button id="hideBtn" class="hbtn" type="button" data-tip="Hide panel" data-key="H" aria-label="Hide panel">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
      </button>
    </span>
  </header>
  <div class="body" id="panelBody"></div>
</aside>
<button id="showTab" type="button" aria-label="Show panel">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
  <span>Show panel</span>
</button>
<input id="fileInput" type="file" accept="audio/*" hidden>

<script>
/* =====================================================================
   Sand Sound: a top-down bed of sand on a floor that resonates with sound.
   Where the floor shakes harder than gravity, grains hop about and drain away; they pile up
   along the lines that stay still (Chladni figures). Steep piles slump to sand's natural slope.
   In silence the sand keeps its shape. Drag to draw a groove.
   Background and sources: reports/Sand response to sound vibration.md
   ===================================================================== */

/* ---------- settings ---------- */
const DEFAULTS = {
  _v: 3,
  // sound
  source: "file",        // "file" | "mic" | "tone"
  tone: 240,             // Hz, test tone
  volume: 60,            // %, what you hear (file and tone)
  sensitivity: 12,       // how hard the sound drives the floor. Sand only moves where the shaking beats gravity.
  smoothing: 0.6,        // how slowly the floor's resonances follow the sound (0 = instant)
  // floor (the vibrating plate under the sand)
  pitch: 60,             // Hz, the floor's lowest resonance. Every other resonance is a multiple of it.
  resonance: 12,         // Q: how sharply each resonance is tuned. High = only exact pitches ring.
  // sand
  depth: 6,              // px, thickness of the loose top layer of sand
  flow: 8,               // transport steps per frame: how fast shaken sand travels
  repose: 34,            // degrees, the steepest slope still sand can hold (dry sand: about 34)
  finger: 14,            // px, radius of the groove a drag draws
  grain: 1.2,            // px per grain
  variation: 0.5,        // grain roughness and shade difference
  shimmer: 0.5,          // how many grains visibly hop where the floor is shaking
  // look
  sand: "#cdb9a2",
  light: 225,            // degrees, where the light comes from (225 = top left)
  elevation: 28,         // degrees above the sand; low = long shadows
  shadow: 1,             // strength of the cast shadows
  softness: 0.25         // 0 = hard sunlight, 1 = soft overcast light
};

const FIELDS = [
  { title: "Sound", items: [
    { type: "source" },
    { key: "tone", label: "Tone", min: 40, max: 2000, step: 1, unit: "Hz", effect: "audio", show: "tone" },
    { key: "volume", label: "Volume", min: 0, max: 100, step: 1, unit: "%", effect: "audio" },
    { key: "sensitivity", label: "Sensitivity", min: 1, max: 100, step: 1, unit: "×" },
    { key: "smoothing", label: "Smoothing", min: 0, max: 0.95, step: 0.05 }
  ]},
  { title: "Floor", items: [
    { key: "pitch", label: "Lowest pitch", min: 20, max: 200, step: 1, unit: "Hz" },
    { key: "resonance", label: "Resonance", min: 2, max: 60, step: 1 }
  ]},
  { title: "Sand", items: [
    { key: "depth", label: "Depth", min: 1, max: 12, step: 0.5, unit: "px", effect: "smooth" },
    { key: "flow", label: "Flow speed", min: 1, max: 16, step: 1 },
    { key: "repose", label: "Repose angle", min: 15, max: 45, step: 1, unit: "°" },
    { key: "finger", label: "Finger", min: 4, max: 60, step: 1, unit: "px" },
    { key: "grain", label: "Grain size", min: 0.5, max: 4, step: 0.1, unit: "px" },
    { key: "variation", label: "Roughness", min: 0, max: 1, step: 0.05 },
    { key: "shimmer", label: "Shimmer", min: 0, max: 1, step: 0.05 }
  ]},
  { title: "Look", items: [
    { type: "color", key: "sand", label: "Sand" },
    { key: "light", label: "Light angle", min: 0, max: 360, step: 5, unit: "°" },
    { key: "elevation", label: "Light height", min: 10, max: 80, step: 1, unit: "°" },
    { key: "shadow", label: "Shadow", min: 0, max: 1, step: 0.05 },
    { key: "softness", label: "Softness", min: 0, max: 1, step: 0.05 }
  ]}
];

const MAX_CELLS = 200000;          // cap on the sand grid, so big screens stay fast
const MAX_MODES = 6;               // how many resonances shape the floor at once (the strongest ones)
const FLOW = 0.06;                 // transport strength per step, just above lift-off
const F_MIN = 30, F_MAX = 8000;    // Hz, the part of the spectrum the floor listens to

const STORE = "sandSoundSettings", STORE_UI = "sandSoundPanelUI";
let S = { ...DEFAULTS };
try { const j = JSON.parse(localStorage.getItem(STORE)); if (j && j._v === DEFAULTS._v) Object.assign(S, j); } catch (e) {}
let UI = { hidden: false, closed: {} };
try { Object.assign(UI, JSON.parse(localStorage.getItem(STORE_UI)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
const saveUI = () => { try { localStorage.setItem(STORE_UI, JSON.stringify(UI)); } catch (e) {} };

/* ---------- the floor's resonances ----------
   The floor behaves like a square plate shaken at its centre. Such a plate only rings in shapes
   that are mirror-symmetric both ways: cos(n pi x) cos(m pi y) + cos(m pi x) cos(n pi y) with n and m
   even. Stiff plates carry bending waves, so a shape's pitch rises with (n² + m²): twice the lines
   needs four times the frequency. (The cosine shapes are the usual approximation; they are least
   accurate for the two or three lowest shapes.) */
const MODES = [];
for (let m = 0; m <= 16; m += 2) for (let n = 0; n <= m; n += 2) if (n + m) MODES.push([n, m]);
const NM = MODES.length;
const E = new Float32Array(NM);    // how strongly each resonance is ringing (squared amplitude)

/* ---------- state ---------- */
const cv = document.getElementById("c");
const gl = cv.getContext("webgl2", { antialias: false, alpha: false });
let VW = 0, VH = 0;                // the page in CSS px (the sand lives in this space)
let DPR = 1, OX = 0, OY = 0;       // screen pixels per CSS px (browser zoom x pinch zoom), and the corner of the visible part
let HC = 3, HW = 0, HH = 0;        // sand grid: cell size in CSS px, and its size in cells

/* The finger bulldozes: sand at its leading edge is shouldered outward and a little forward, into the rims.

const PVERT = `#version 300 es

  const dots = "<i></i>".repeat(9);
  const track = document.createElement("span"); track.className = "track";
  track.innerHTML = `<span class="dots">${dots}</span><span class="fill"><span class="dots">${dots}</span></span><span class="handle"></span>`;
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = f.label;
  const val = document.createElement("span"); val.className = "val";
  const input = document.createElement("input");
  input.type = "text"; input.inputMode = "decimal"; input.size = 1; input.autocomplete = "off"; input.spellcheck = false;
  input.setAttribute("aria-label", f.label);
  val.appendChild(input);
  const unit = document.createElement("span"); unit.className = "unit"; unit.textContent = f.unit || "";
  const rst = makeReset();
  wrap.append(track, lbl, val, unit, rst);

  const PAD = 12;
  let dragging = false, moved = false, downX = 0, lastX = 0, raw = 0, pid = null;
  const setPos = v => {
    const w = wrap.clientWidth || 270;
    wrap.style.setProperty("--p", (PAD + (clamp(v) - f.min) / (f.max - f.min) * (w - 2 * PAD)).toFixed(1) + "px");
    wrap.style.setProperty("--pw", (w - 2 * PAD) + "px");
  };
  const render = () => {
    const s = fmt(S[f.key]); input.value = s; val.dataset.v = s;
    rst.style.visibility = S[f.key] === DEFAULTS[f.key] ? "hidden" : "visible";
    if (!dragging) setPos(S[f.key]);
  };
  const commit = v => { if (v === S[f.key]) return; S[f.key] = v; render(); applyEffect(f); };

  wrap.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".reset") || wrap.classList.contains("editing")) return;
    e.preventDefault();
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    dragging = true; moved = false; downX = lastX = e.clientX; raw = S[f.key]; pid = e.pointerId;
    try { wrap.setPointerCapture(pid); } catch (err) {}
  });
  wrap.addEventListener("pointermove", e => {
    if (!dragging || e.pointerId !== pid) return;
    if (!moved) {
      if (Math.abs(e.clientX - downX) < 3) return;
      moved = true; wrap.classList.add("dragging"); document.documentElement.classList.add("scrubbing");
    }
    const perPx = (f.max - f.min) / Math.max(40, wrap.clientWidth - 2 * PAD);
    raw += (e.clientX - lastX) * perPx * (e.shiftKey ? 0.1 : 1);
    lastX = e.clientX;
    raw = Math.min(f.max + (f.max - f.min), Math.max(f.min - (f.max - f.min), raw));
    setPos(raw);
    commit(snap(raw));
  });
  const end = e => {
    if (!dragging || (e && e.pointerId !== pid)) return;
    dragging = false;
    wrap.classList.remove("dragging"); document.documentElement.classList.remove("scrubbing");
    setPos(S[f.key]);
    if (!moved && e && e.type === "pointerup") { input.focus(); input.select(); }
  };
  wrap.addEventListener("mousedown", e => { if (!wrap.classList.contains("editing") && !e.target.closest(".reset")) e.preventDefault(); });
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);
  wrap.addEventListener("lostpointercapture", end);

  input.addEventListener("focus", () => { wrap.classList.add("editing"); input.select(); });
  input.addEventListener("input", () => { val.dataset.v = input.value; });
  const apply = () => {
    const m = String(input.value).replace(",", ".").match(/-?\d*\.?\d+/);
    if (m) commit(snap(parseFloat(m[0])));
    render();
  };
  input.addEventListener("blur", () => { wrap.classList.remove("editing"); apply(); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { apply(); input.blur(); }
    else if (e.key === "Escape") { render(); input.blur(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      commit(snap(S[f.key] + (e.key === "ArrowUp" ? 1 : -1) * f.step * (e.shiftKey ? 10 : 1)));
      input.select();
    }
  });
  rst.addEventListener("click", () => commit(DEFAULTS[f.key]));
  if (window.ResizeObserver) new ResizeObserver(() => { if (!dragging) setPos(S[f.key]); }).observe(wrap);
  controls[f.key] = { set: render };
  render();
  return wrap;
}

function makeColor(f) {
  const wrap = document.createElement("div"); wrap.className = "col";
  const lbl = document.createElement("span"); lbl.textContent = f.label;
  const input = document.createElement("input"); input.type = "color"; input.setAttribute("aria-label", f.label);
  const code = document.createElement("code");
  const rst = makeReset();
  wrap.append(lbl, input, code, rst);
  const render = () => {
    input.value = S[f.key]; code.textContent = S[f.key].toUpperCase();
    rst.style.visibility = S[f.key] === DEFAULTS[f.key] ? "hidden" : "visible";
  };
  input.addEventListener("input", () => { S[f.key] = input.value; render(); applyEffect(f); });
  rst.addEventListener("click", () => { S[f.key] = DEFAULTS[f.key]; render(); applyEffect(f); });
  controls[f.key] = { set: render };
  render();
  return wrap;
}

let segBtns = {}, playBtn, statusEl;
const conditional = [];            // [element, source it belongs to]
function makeSource() {
  const frag = document.createDocumentFragment();
  const seg = document.createElement("div"); seg.className = "seg";
  [["file", "File"], ["mic", "Mic"], ["tone", "Tone"]].forEach(([k, label]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label;
    b.addEventListener("click", () => setSource(k));
    segBtns[k] = b; seg.appendChild(b);
  });
  const row = document.createElement("div"); row.className = "buttons";
  playBtn = document.createElement("button"); playBtn.type = "button"; playBtn.className = "primary";
  playBtn.addEventListener("click", () => (playing ? stop() : start()));
  const fileBtn = document.createElement("button"); fileBtn.type = "button"; fileBtn.className = "secondary"; fileBtn.textContent = "Choose file";
  fileBtn.addEventListener("click", () => fileInput.click());
  conditional.push([fileBtn, "file"]);
  row.append(playBtn, fileBtn);
  statusEl = document.createElement("div"); statusEl.className = "note";
  frag.append(seg, row, statusEl);
  return frag;
}

function updateUI() {
  for (const k in segBtns) segBtns[k].classList.toggle("on", S.source === k);
  conditional.forEach(([el, src]) => { el.hidden = S.source !== src; });
  if (!playBtn) return;
  playBtn.textContent = playing ? (S.source === "file" ? "Pause" : "Stop") : (S.source === "mic" ? "Listen" : "Play");
  statusEl.textContent =
    S.source === "file" ? (fileName || "No file yet. Drop one anywhere on the page.") :
    S.source === "mic" ? (micError || (playing ? "Listening to the microphone." : "Uses your microphone. Nothing is recorded.")) :
    (playing ? "Playing a steady tone." : "A steady test tone. Drag Tone to sweep it.");
}

function buildPanel() {
  FIELDS.forEach(sec => {
    const cat = document.createElement("section"); cat.className = "cat";
    if (UI.closed[sec.title]) cat.classList.add("closed");
    const head = document.createElement("button"); head.type = "button"; head.className = "cat-head";
    head.innerHTML = `<span>${sec.title}</span>${CHEV_SVG}`;
    head.addEventListener("click", () => { UI.closed[sec.title] = cat.classList.toggle("closed"); saveUI(); });
    const body = document.createElement("div"); body.className = "cat-body";
    const grid = document.createElement("div"); grid.className = "grid";
    sec.items.forEach(f => {
      if (f.type === "source") { grid.appendChild(makeSource()); return; }
      const el = f.type === "color" ? makeColor(f) : makeScrub(f);
      if (f.show) conditional.push([el, f.show]);
      grid.appendChild(el);
    });
    body.appendChild(grid); cat.append(head, body); panelBody.appendChild(cat);
  });
  const row = document.createElement("div"); row.className = "buttons end";
  const sc = document.createElement("button"); sc.type = "button"; sc.className = "secondary"; sc.textContent = "Smooth sand";
  sc.addEventListener("click", shakeSmooth);
  const ra = document.createElement("button"); ra.type = "button"; ra.className = "secondary"; ra.textContent = "Reset all";
  ra.addEventListener("click", () => {
    const src = S.source;
    S = { ...DEFAULTS, source: src };
    save(); smooth(); applyAudio();
    for (const k in controls) controls[k].set();
    updateUI();
    record("*", true);
  });
  row.append(sc, ra); panelBody.appendChild(row);
}

function togglePanel(hide) {
  UI.hidden = hide === undefined ? !panel.classList.contains("collapsed") : hide;
  panel.classList.toggle("collapsed", UI.hidden);
  saveUI();
}
document.getElementById("hideBtn").addEventListener("click", () => togglePanel(true));
document.getElementById("showTab").addEventListener("click", () => togglePanel(false));

/* ---------- keys, files ---------- */
window.addEventListener("contextmenu", e => e.preventDefault());   // no right-click menu anywhere on the page
window.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA") && t.type !== "color") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "h" || e.key === "H") togglePanel();
  else if (e.code === "Space") { e.preventDefault(); if (t && t.blur && t.tagName === "BUTTON") t.blur(); playing ? stop() : start(); }
});
fileInput.addEventListener("change", () => { loadFile(fileInput.files[0]); fileInput.value = ""; });
window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("dropping"); });
window.addEventListener("dragleave", e => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
window.addEventListener("drop", e => {
  e.preventDefault(); document.body.classList.remove("dropping");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && (f.type.startsWith("audio/") || f.type.startsWith("video/") || !f.type)) loadFile(f);
});
window.addEventListener("resize", () => { boxW = boxH = 0; resize(); });

/* ---------- undo / redo: snapshots of the settings. Rapid changes to one field (a drag, typing) collapse into one step.
   The sound source is left out: undo changes how the sand behaves, never what is playing. ---------- */
const hist = { stack: [], i: -1, lastKey: null, lastT: 0 };
const undoBtn = document.getElementById("undoBtn"), redoBtn = document.getElementById("redoBtn");
function updateHistButtons() {
  undoBtn.setAttribute("aria-disabled", String(hist.i <= 0));
  redoBtn.setAttribute("aria-disabled", String(hist.i >= hist.stack.length - 1));
}
function record(key, force) {
  const now = Date.now(), snap = JSON.stringify({ ...S, source: undefined });
  if (hist.i >= 0 && hist.stack[hist.i] === snap) return;                       // nothing actually changed
  if (!force && hist.i > 0 && key === hist.lastKey && now - hist.lastT < 600) {
    hist.stack[hist.i] = snap;                                                  // same gesture: update the current step
  } else {
    hist.stack.length = hist.i + 1;                                             // a new change drops the redo branch
    hist.stack.push(snap); hist.i++;
    if (hist.stack.length > 100) { hist.stack.shift(); hist.i--; }
  }
  hist.lastKey = key; hist.lastT = now;
  updateHistButtons();
}
function goHist(d) {
  const j = hist.i + d;
  if (j < 0 || j >= hist.stack.length) return;
  const prev = S;
  hist.i = j; hist.lastKey = null;
  S = { ...DEFAULTS, ...JSON.parse(hist.stack[j]), source: prev.source };
  for (const k in controls) controls[k].set();
  save(); applyAudio();
  if (prev.depth !== S.depth) smooth();
  dirty = true;
  updateHistButtons();
}
undoBtn.addEventListener("click", () => goHist(-1));
redoBtn.addEventListener("click", () => goHist(1));
window.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k !== "z" && k !== "y") return;
  const t = document.activeElement, tag = t && t.tagName;
  if (tag === "TEXTAREA" || tag === "SELECT" || (tag === "INPUT" && t.type === "text")) return;   // keep native text undo while typing
  e.preventDefault();
  goHist(k === "y" || e.shiftKey ? 1 : -1);
});

/* ---------- tooltip: any element with data-tip="Label" (and optionally data-key="Ctrl+Z") gets a dark pill with the
   label and one keycap per key. It shows after a short delay on hover or at once on keyboard focus, below the
   element (above if there is no room). ---------- */
const tipEl = document.createElement("div");
tipEl.id = "tip"; tipEl.setAttribute("role", "tooltip");
document.body.appendChild(tipEl);
let tipTarget = null, tipTimer = 0;
function hideTip() { clearTimeout(tipTimer); tipTarget = null; tipEl.classList.remove("show"); }
function showTip(el) {
  tipEl.textContent = "";
  const label = document.createElement("span");
  label.textContent = el.dataset.tip;
  tipEl.appendChild(label);
  const keys = (el.dataset.key || "").split("+").filter(Boolean);
  if (keys.length) {
    const wrap = document.createElement("span");
    wrap.className = "keys";
    for (const k of keys) { const kc = document.createElement("kbd"); kc.textContent = k; wrap.appendChild(kc); }
    tipEl.appendChild(wrap);
  }
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect(), gap = 2;
  let y = r.bottom + gap;
  if (y + t.height > innerHeight - 4) y = r.top - gap - t.height;               // no room below: flip above
  const x = Math.max(4, Math.min(innerWidth - t.width - 4, r.left + r.width / 2 - t.width / 2));
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  tipEl.classList.add("show");
}
function tipEnter(e, delay) {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el || el === tipTarget) return;
  hideTip();
  tipTarget = el;
  if (!delay) showTip(el);
  else tipTimer = setTimeout(() => { if (document.contains(el)) showTip(el); else hideTip(); }, delay);
}
document.addEventListener("mouseover", e => tipEnter(e, 100));
document.addEventListener("focusin", e => { if (e.target.matches && e.target.matches(":focus-visible")) tipEnter(e, 0); });
document.addEventListener("mouseout", e => { if (tipTarget && !tipTarget.contains(e.relatedTarget)) hideTip(); });
document.addEventListener("focusout", hideTip);
document.addEventListener("pointerdown", hideTip, true);
document.addEventListener("keydown", hideTip, true);
document.addEventListener("scroll", hideTip, true);

/* ---------- go ---------- */
try { initGL(); if (gl) initGrainsGL(); } catch (e) { console.error(e); }
if (!gl || !prog) hint.textContent = "This needs WebGL 2, which this browser did not provide.";
resize();
buildPanel();
record("init", true);                // the baseline for undo
if (UI.hidden) panel.classList.add("collapsed");
updateUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
